spring:
  application:
    name: vyapaarmitra-backend
  datasource:
    # e.g. jdbc:postgresql://db.<project>.supabase.co:5432/postgres (Supabase used as plain Postgres only)
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # The platform scales horizontally; keep the per-instance pool small to respect Postgres connection limits
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    # Reject typo'd fields instead of silently dropping them. Unknown enum values throw by
    # default (READ_UNKNOWN_ENUM_VALUES_AS_NULL is off) → HttpMessageNotReadableException → 400,
    # so a bad deletion-request "reason" can't 500 or silently coerce to null.
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
  servlet:
    multipart:
      # Images are uploaded at near-original quality (no client compression) and
      # downscaled by Cloudinary on its side. 10 MB matches Cloudinary's free-tier
      # per-image limit; anything larger is rejected with a clean 413.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  # Public origin of the customer web viewer (Vercel). Used to build the /s/<token>
  # khata link appended to every reminder. Must be set in prod (Cloud Run env).
  web-url: ${APP_WEB_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  google:
    # Comma-separated OAuth client IDs accepted as valid token audiences (web, Android, iOS).
    client-ids: ${GOOGLE_CLIENT_IDS:}
  mail:
    from: ${MAIL_FROM:VyapaarMitra <onboarding@resend.dev>}
    # When blank, one-time codes are logged to the server instead of emailed (dev only).
    resend-api-key: ${RESEND_API_KEY:}
    otp-ttl-minutes: ${OTP_TTL_MINUTES:10}
  razorpay:
    # Test mode keys (rzp_test_*) work immediately with no KYC. When blank, checkout
    # returns a clear "payments not set up" error and no charge can happen.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    # Secret configured on the Razorpay webhook — signs every callback body.
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    # Base URL the hosted payment page redirects to after payment (the web
    # /billing/thanks screen, which pulls the grant and deep-links into the app).
    # Blank → Razorpay shows its own end page and the buyer returns to the app by hand.
    callback-base-url: ${RAZORPAY_CALLBACK_BASE_URL:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Max login/refresh attempts per client IP per minute (brute-force guard).
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
  newrelic:
    # New Relic Log API — the mobile app posts events to /api/v1/telemetry and we relay them
    # here as logs (30-day retention vs ~8 days for custom events). Server-only ingest key: it
    # never ships in the client bundle. When blank, events are dropped so local/dev runs without NR.
    account-id: ${NEWRELIC_ACCOUNT_ID:}
    ingest-key: ${NEWRELIC_INGEST_KEY:}
    # Override for the EU datacenter: https://log-api.eu.newrelic.com/log/v1
    endpoint: ${NEWRELIC_ENDPOINT:}
  internal:
    # Shared secret for server-to-server internal endpoints (X-Internal-Token), e.g. the
    # account-purge safety net driven by Cloud Scheduler. When blank, internal endpoints
    # refuse every call.
    purge-token: ${INTERNAL_PURGE_TOKEN:}
  bootstrap:
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
    owner-name: ${BOOTSTRAP_OWNER_NAME:Owner}
    business-name: ${BOOTSTRAP_BUSINESS_NAME:My Shop}
    branch-name: ${BOOTSTRAP_BRANCH_NAME:Main Branch}
