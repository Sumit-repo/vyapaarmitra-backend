spring:
  application:
    name: vyapaarmitra-backend
  datasource:
    # e.g. jdbc:postgresql://db.<project>.supabase.co:5432/postgres (Supabase used as plain Postgres only)
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Cloud Run scales horizontally; keep the per-instance pool small to respect Postgres connection limits
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
    owner-name: ${BOOTSTRAP_OWNER_NAME:Owner}
    business-name: ${BOOTSTRAP_BUSINESS_NAME:My Shop}
    branch-name: ${BOOTSTRAP_BRANCH_NAME:Main Branch}
