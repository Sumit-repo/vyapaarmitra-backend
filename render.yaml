# Render Blueprint — deploy with "New > Blueprint" pointing at this repo.
# Secrets (sync: false) are prompted for in the Render dashboard, never committed.
services:
  - type: web
    name: vyapaarmitra-api
    runtime: docker
    region: singapore # closest to India
    plan: starter # free tier spins down on idle; starter keeps the API warm
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: BOOTSTRAP_OWNER_PASSWORD
        sync: false
      - key: BOOTSTRAP_OWNER_NAME
        sync: false
      - key: BOOTSTRAP_BUSINESS_NAME
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DB_POOL_SIZE
        value: "5"
